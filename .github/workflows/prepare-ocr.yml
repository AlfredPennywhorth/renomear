name: Preparar OCR local

on:
  push:
    branches: [develop]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Instalar e atualizar lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Preparar assets locais do OCR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/ocr public/pdf
          mkdir -p public/ocr/core public/ocr/lang public/pdf

          cp node_modules/tesseract.js/dist/worker.min.js public/ocr/worker.min.js
          cp node_modules/tesseract.js-core/tesseract-core* public/ocr/core/

          LANG_FILE="$(find node_modules/@tesseract.js-data/por -type f -name 'por.traineddata.gz' | head -n 1)"
          test -n "$LANG_FILE"
          cp "$LANG_FILE" public/ocr/lang/por.traineddata.gz

          cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs public/pdf/pdf.worker.min.mjs

          test -f public/ocr/worker.min.js
          test -f public/ocr/lang/por.traineddata.gz
          test -f public/pdf/pdf.worker.min.mjs

      - name: Registrar lockfile e assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml public/ocr public/pdf
          git diff --cached --quiet && exit 0
          git commit -m "build: incluir runtime OCR local"
          git push
